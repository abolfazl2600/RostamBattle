name: Android native build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36 and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: true
      - name: Install locked Capacitor tools
        run: npm ci
      - name: Web packaging and game checks
        run: |
          npm run check:build
          npm run check:game
      - name: Sync local assets into native application
        run: npm run android:sync
      - name: Assemble debug and unsigned release variants
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Direct release must fail closed without secrets
        shell: bash
        env:
          ROSTAM_DIRECT_KEYSTORE: ''
          ROSTAM_DIRECT_STORE_PASSWORD: ''
          ROSTAM_DIRECT_KEY_ALIAS: ''
          ROSTAM_DIRECT_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          cd android
          if ./gradlew --no-daemon :app:assembleDirectRelease > /tmp/rostam-direct-unsigned-block.log 2>&1; then
            echo "FAIL: Direct release succeeded with no signing credentials." >&2
            exit 1
          fi
          if ! grep -Fq "Direct release signing is not configured." /tmp/rostam-direct-unsigned-block.log; then
            echo "FAIL: Direct release did not fail for the expected missing-signing reason." >&2
            tail -n 45 /tmp/rostam-direct-unsigned-block.log >&2
            exit 1
          fi
          echo "PASS: Missing signing credentials block Direct release."
      - name: Verify Android application metadata
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          DEBUG="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG"
          test -f "$RELEASE"
          "$AAPT" dump badging "$DEBUG" > /tmp/rostam-debug.badging
          "$AAPT" dump badging "$RELEASE" > /tmp/rostam-release.badging
          grep -F "name='io.github.abolfazl.nabardrostam.dev'" /tmp/rostam-debug.badging
          grep -F "name='io.github.abolfazl.nabardrostam'" /tmp/rostam-release.badging
          grep -F "sdkVersion:'28'" /tmp/rostam-debug.badging
          grep -F "targetSdkVersion:'36'" /tmp/rostam-debug.badging
          grep -F "targetSdkVersion:'36'" /tmp/rostam-release.badging
          # Ensure release variant is not mistakenly uploaded as signed.
          echo "Native Debug APK compiled; release compiled for verification only (unsigned)."
      - uses: actions/upload-artifact@v4
        with:
          name: rostams-battle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    name: emulator-api-${{ matrix.api }}
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: rostams-battle-debug-apk
          path: android-apk
      - name: Enable KVM acceleration on Ubuntu runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install and inspect Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/android-emulator-smoke.sh ${{ matrix.api }}
      - name: Preserve emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rostam-emulator-api-${{ matrix.api }}-evidence
          path: emulator-evidence/
          if-no-files-found: warn
